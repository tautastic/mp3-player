[env]
extra_scripts = pre:unflags.py
build_unflags =
    -std=gnu++2a
    -std=gnu++2b
build_flags =
    -std=gnu++23
build_src_flags =
    -Wall
    -Wextra

[env:device]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<core/> +<device/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:simulator]
platform = native
lib_deps = lvgl/lvgl@9.6.0
build_src_filter = +<core/> +<ui/> +<simulator/>
build_flags =
    ${env.build_flags}
    -DLV_CONF_SKIP
    -DLV_USE_SDL=1
    -DLV_THEME_DEFAULT_DARK=1
    !pkg-config --cflags --libs sdl2
